name: Auto linter

on:
  push:
    paths: "*.py"


jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: install linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check .
    

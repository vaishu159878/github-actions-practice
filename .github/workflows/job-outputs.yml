name: Job Outputs

on:
  push:

jobs:

  generate-date:
    runs-on: ubuntu-latest

    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
      - name: Generate today's date
        id: date
        run: |
          echo "today=$(date)" >> "$GITHUB_OUTPUT"

  display-date:
    needs: generate-date
    runs-on: ubuntu-latest

    steps:
      - name: Display date
        run: |
          echo "Date generated by previous job:"
          echo "${{ needs.generate-date.outputs.today }}"

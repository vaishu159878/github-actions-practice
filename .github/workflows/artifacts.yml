name: Upload Artifact

on:
  workflow_dispatch:

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate test report
        run: |
          mkdir -p reports
          echo "Day 44 Test Report" > reports/test-report.txt
          echo "Test status: PASS" >> reports/test-report.txt
          echo "Generated by GitHub Actions" >> reports/test-report.txt
          cat reports/test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-report.txt
